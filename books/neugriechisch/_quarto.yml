project:
  type: book
  output-dir: _book
  # Only the book itself is rendered, not the working files (STYLE.md, outline.md, ...).
  render:
    - index.qmd
    - chapters/*.qmd
  # Recordings from scripts/make_audio.py
  resources:
    - audio/*

book:
  title: "Neugriechisch"
  subtitle: "Vom Anfängerkurs zum Film ohne Untertitel"
  author: "learn-anything"
  search: true
  sidebar:
    tools:
      - icon: collection
        href: ../index.html
        text: "Bibliothek"
  chapters:
    - index.qmd
    - chapters/01-auffrischung.qmd
    - chapters/02-aorist.qmd
    - chapters/03-unregelmaessige-aoriste.qmd
    - chapters/04-imperfekt.qmd
    - chapters/05-tha-und-na.qmd
    - chapters/06-nomen-adjektive-zahlen.qmd
    - chapters/07-genitiv-anrede.qmd
    - chapters/08-schwache-pronomen.qmd
    - chapters/09-imperativ.qmd
    - chapters/10-deponentien.qmd
    - chapters/11-zeit.qmd
    - chapters/12-steigerung-wiederholung.qmd
    - chapters/13-mediopassiv.qmd
    - chapters/14-perfekt.qmd

lang: de

format: learn-anything-html
