project:
  type: book
  output-dir: _book
  # Only the book itself is rendered, not the working files (STYLE.md, outline.md, ...).
  render:
    - index.qmd
    - chapters/*.qmd
  # Recordings from scripts/make_audio.py
  resources:
    - audio/*

book:
  title: "Neugriechisch"
  subtitle: "Vom Anfängerkurs zum Film ohne Untertitel"
  author: "learn-anything"
  search: true
  sidebar:
    tools:
      - icon: collection
        href: ../index.html
        text: "Bibliothek"
  chapters:
    - index.qmd
    - chapters/01-auffrischung.qmd
    - chapters/02-aorist.qmd

lang: de

format: learn-anything-html
